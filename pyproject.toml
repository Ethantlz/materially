[project]
name = "materially"
version = "0.1.0"
description = "Drywall/framing takeoff: drawing set -> sheets -> conditions -> orders, on MongoDB."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "pymongo>=4.8",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "pillow>=10.0",
    "openai>=1.40",
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mongomock>=4.1",
    "reportlab>=4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
