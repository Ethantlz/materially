# The Luminal base URL and key live in Infisical (dev, folder /litellm); infra/up.ps1 injects them with
# `infisical run --path /litellm`, so nothing secret is in this file. Rotate the key in Infisical, then rerun up.ps1.
model_list:
  - model_name: deepseek-ai/DeepSeek-V4.1-Flash  # the exact name app/router.py and model_policy ask for
    litellm_params:
      model: openai/deepseek-ai/DeepSeek-V4.1-Flash
      api_base: os.environ/LUMINAL_BASE_URL
      api_key: os.environ/LUMINAL_API_KEY
      rpm: 30

litellm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 120

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
