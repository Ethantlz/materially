# Local infra: self-hosted Infisical (secrets) + LiteLLM proxy (model gateway, Luminal key lives here).
# Start with infra/up.ps1 — it passes --env-file ~/.c15/infra.env (generated by infra/init_secrets.py, never in git).
name: materially-infra

services:
  infisical:
    image: infisical/infisical:latest
    restart: unless-stopped
    depends_on:
      infisical-db:
        condition: service_healthy
      infisical-redis:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY:?run infra/init_secrets.py}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET:?run infra/init_secrets.py}
      DB_CONNECTION_URI: postgres://infisical:${INFISICAL_DB_PASSWORD}@infisical-db:5432/infisical
      REDIS_URL: redis://infisical-redis:6379
      SITE_URL: http://localhost:8080
      TELEMETRY_ENABLED: "false"

  infisical-db:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: infisical
      POSTGRES_PASSWORD: ${INFISICAL_DB_PASSWORD:?run infra/init_secrets.py}
      POSTGRES_DB: infisical
    volumes:
      - infisical_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infisical -d infisical"]
      interval: 3s
      timeout: 5s
      retries: 20

  infisical-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - infisical_redis:/data

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    depends_on:
      litellm-db:
        condition: service_healthy
    ports:
      - "4000:4000"
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    environment:
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@litellm-db:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?run infra/init_secrets.py}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?run infra/init_secrets.py}
      STORE_MODEL_IN_DB: "True"
      UI_USERNAME: admin
      UI_PASSWORD: ${LITELLM_MASTER_KEY}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  litellm-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:?run infra/init_secrets.py}
      POSTGRES_DB: litellm
    volumes:
      - litellm_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  infisical_pg:
  infisical_redis:
  litellm_pg:
