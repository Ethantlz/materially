<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}Materially{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
  <link rel="stylesheet" href="/static/app.css">
  {% block head %}{% endblock %}
</head>
<body class="{% block bodyclass %}{% endblock %}">
  <header class="top">
    <a class="brand" href="/" data-testid="nav-home"><img class="mark" src="/static/logo.svg" alt="">Materially</a>
    {% if job %}<span class="faint">/</span><a class="crumb" href="/jobs/{{ job.id }}/takeoff" data-testid="nav-job" title="{{ job.name }}">{{ job.name }}</a>{% endif %}
    <span class="spacer"></span>
    {% block bar %}{% endblock %}
    {% if job %}
    <div class="costwrap">
      <button type="button" class="cost" id="cost" data-testid="cost-badge" aria-expanded="false" title="Every model call on this job, logged in MongoDB"><i class="dot"></i><b id="cost-n">·</b> AI decisions · <b id="cost-usd">$·</b></button>
      <div class="costpop" id="cost-pop" data-testid="cost-detail" hidden></div>
    </div>
    {% endif %}
  </header>
  <main class="page">{% block body %}{% endblock %}</main>
  <script src="/static/api.js"></script>
  {% if job %}<script>window.JOB_ID = {{ job.id | tojson }}; costBadge(JOB_ID);</script>{% endif %}
  {% block scripts %}{% endblock %}
</body>
</html>
