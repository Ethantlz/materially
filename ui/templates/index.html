{% extends "base.html" %}
{% block body %}
<section class="card upload">
  <h1>New project</h1>
  <form id="upload-form" data-testid="upload-form">
    <label>Project name
      <input name="name" required placeholder="e.g. Penn State Lab Fit-Out" data-testid="job-name">
    </label>
    <label class="drop" id="drop" data-testid="job-drop">
      <input type="file" name="files" accept="application/pdf,.pdf" multiple required data-testid="job-files">
      <span id="drop-text">Drop drawing PDFs here, or click to choose</span>
    </label>
    <button type="submit" data-testid="job-upload">Upload drawings</button>
    <p class="err" id="upload-err" data-testid="upload-error"></p>
  </form>
</section>

<section class="card">
  <h2>Projects</h2>
  {% if jobs %}
  <ul class="jobs" data-testid="job-list">
    {% for j in jobs %}
    <li><a href="/jobs/{{ j.id }}">{{ j.name }}</a>
      <span class="muted">{{ j.pages_total or 0 }} sheets · {{ j.status }}</span></li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="muted">No projects yet.</p>
  {% endif %}
</section>
{% endblock %}
{% block scripts %}
<script>
const form = document.getElementById("upload-form");
const input = form.querySelector("input[type=file]");
const dropText = document.getElementById("drop-text");
input.addEventListener("change", () => {
  dropText.textContent = [...input.files].map(f => f.name).join(", ") || "Drop drawing PDFs here, or click to choose";
});
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = form.querySelector("button");
  btn.disabled = true; btn.textContent = "Uploading…";
  const res = await fetch("/api/jobs", { method: "POST", body: new FormData(form) });
  if (res.ok) { location.href = "/jobs/" + (await res.json()).job_id; return; }
  document.getElementById("upload-err").textContent = (await res.json()).detail || "Upload failed";
  btn.disabled = false; btn.textContent = "Upload drawings";
});
</script>
{% endblock %}
